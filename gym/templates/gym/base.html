{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pulso - {% block titulo %}Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">P</span>
      <div class="brand-text">
        <strong>PULSO</strong>
        <span>panel del gimnasio</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="{% url 'gym:dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Panel
      </a>
      <a href="{% url 'gym:miembro_list' %}" class="nav-link {% if 'miembro' in request.resolver_match.url_name %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20.5c1.5-4 4-6 7.5-6s6 2 7.5 6"/></svg>
        Miembros
      </a>
      <a href="{% url 'gym:entrenador_list' %}" class="nav-link {% if request.resolver_match.url_name == 'entrenador_list' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v6"/><circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 2"/></svg>
        Entrenadores
      </a>
      <a href="{% url 'gym:clase_list' %}" class="nav-link {% if 'clase' in request.resolver_match.url_name or 'inscripcion' in request.resolver_match.url_name %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>
        Clases
      </a>
      <a href="{% url 'gym:membresia_list' %}" class="nav-link {% if 'membresia' in request.resolver_match.url_name %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5.5" width="19" height="13" rx="1.5"/><path d="M2.5 9.5h19"/><path d="M6 14h4"/></svg>
        Membresías
      </a>
      <a href="{% url 'gym:pago_list' %}" class="nav-link {% if 'pago' in request.resolver_match.url_name %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.8c0-1.3 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.7-2.5 1.7-2.5.7-2.5 2 1.1 2 2.5 2 2.5-.7 2.5-2"/></svg>
        Pagos
      </a>
    </nav>

    <a href="/admin/" class="sidebar-admin">Administración ↗</a>
  </aside>

  <div class="app-main">
    <div class="app-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block contenido %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
